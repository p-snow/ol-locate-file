# CI workflow for ol-locate-file
#
# Unit tests run via ERT + testcover on multiple Emacs versions.
# Integration tests (make integration-test) require Guix and are not
# supported on standard GitHub Actions runners.
#
# To run integration tests locally: make integration-test

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs-version:
          - 30.1
          - snapshot
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@v3
        with:
          version: ${{ matrix.emacs-version }}
      - name: Run unit tests
        run: make unit-test